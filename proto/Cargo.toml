[package]
name = "raft-proto"
version = "0.7.0"
authors = ["The TiKV Project Developers"]
edition = "2021"
license = "Apache-2.0"
keywords = ["raft", "distributed-systems", "ha"]
repository = "https://github.com/pingcap/raft-rs"
homepage = "https://github.com/pingcap/raft-rs"
documentation = "https://docs.rs/raft-proto"
description = "Protocol definitions for the rust language implementation of the Raft algorithm."
categories = ["algorithms", "database-implementations"]
build = "build.rs"

[features]
default = ["protobuf-codec"]
protobuf-codec = ["protobuf-build/protobuf-codec", "bytes", "protobuf/bytes"]
prost-codec = ["protobuf-build/prost-codec", "prost", "lazy_static"]

[build-dependencies.protobuf-build]
# `cargo publish` keeps the version requirement and drops the Git source.
# Remove the Git source after protobuf-build 0.16.0 is on crates.io.
version = "0.16"
git = "https://github.com/tikv/protobuf-build"
rev = "0a12cb802955eb69c35906ab7bf45ecda22d7a33"
default-features = false

[dependencies]
bytes = { version = "1", optional = true }
lazy_static = { version = "1", optional = true }
prost = { version = "0.14", optional = true }
protobuf = { version = "2", optional = true }
